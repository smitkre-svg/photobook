/* Layout concept: native Mac document window. Unified toolbar on top, source-list sidebar left, canvas centre, inspector right. */
:root{
  --bg:#c9c9c9; --toolbar:#e3e3e3; --sidebar:#e9e9e9; --field:#ffffff; --surface:#f4f4f4; --surface2:#f6f6f6;
  --line:rgba(0,0,0,.2); --line2:rgba(0,0,0,.3); --ink:#2b2b2b; --muted:#6b6b6b;
  --accent:#1473e6; --accent-ink:#ffffff; --seg:rgba(0,0,0,.09); --segon:#ffffff; --hover:rgba(0,0,0,.07);
  --stage:#b4b4b4; --bleed:#e8264a; --safe:#1f9d3a; --ph:rgba(60,60,67,.14); --danger:#d7373f;
  --shadow:0 0 0 .5px rgba(0,0,0,.25),0 8px 26px rgba(0,0,0,.28);
  --f-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
  --bg:#1f1f1f; --toolbar:#3a3a3a; --sidebar:#2f2f2f; --field:#1e1e1e; --surface:#383838; --surface2:#404040;
  --line:rgba(0,0,0,.55); --line2:rgba(255,255,255,.16); --ink:#dcdcdc; --muted:#9a9a9a;
  --accent:#2d8ceb; --accent-ink:#ffffff; --seg:rgba(0,0,0,.28); --segon:#5a5a5a; --hover:rgba(255,255,255,.08);
  --stage:#262626; --bleed:#ff4d6d; --safe:#3dd16a; --ph:rgba(235,235,245,.14); --danger:#ff5a5f;
  --shadow:0 0 0 .5px rgba(0,0,0,.6),0 10px 34px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1f1f1f; --toolbar:#3a3a3a; --sidebar:#2f2f2f; --field:#1e1e1e; --surface:#383838; --surface2:#404040;
  --line:rgba(0,0,0,.55); --line2:rgba(255,255,255,.16); --ink:#dcdcdc; --muted:#9a9a9a;
  --accent:#2d8ceb; --accent-ink:#ffffff; --seg:rgba(0,0,0,.28); --segon:#5a5a5a; --hover:rgba(255,255,255,.08);
  --stage:#262626; --bleed:#ff4d6d; --safe:#3dd16a; --ph:rgba(235,235,245,.14); --danger:#ff5a5f;
  --shadow:0 0 0 .5px rgba(0,0,0,.6),0 10px 34px rgba(0,0,0,.6); color-scheme:dark;
}
:root[data-theme="light"]{color-scheme:light}
/* Photoshop-like chrome: flat panels, square corners, hairline separators */
#top,#side,#list{-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.btn{border-radius:3px}
.grp{border-radius:4px}
#tabs{border-radius:4px}#tabs button{border-radius:3px}
#top{box-shadow:0 1px 0 var(--line)}
.theme{display:flex;gap:0;padding:2px;background:var(--seg);border-radius:14px;flex:0 0 auto}
.theme button{width:28px;height:24px;border:0;border-radius:12px;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0;transition:background .15s,color .15s}
.theme button:hover{color:var(--ink)}
.theme button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 1px 2px rgba(0,0,0,.35)}
.theme svg{width:15px;height:15px}

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.35 var(--f-ui);overflow:hidden;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:rgba(128,128,128,.45) transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:0}
#app{height:100%;display:grid;grid-template-columns:152px minmax(0,1fr) 296px;grid-template-rows:auto minmax(0,1fr);grid-template-areas:"top top top" "list stage side"}

/* unified toolbar */
#top{grid-area:top;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px 16px;background:var(--toolbar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-bottom:1px solid var(--line)}
.reg{display:grid;grid-template-columns:repeat(2,8px);grid-template-rows:repeat(2,8px);gap:1px;border-radius:3px;overflow:hidden;box-shadow:0 0 0 .5px var(--line2)}
.reg i{display:block}.reg i:nth-child(1){background:#00a6d6}.reg i:nth-child(2){background:#e6007e}.reg i:nth-child(3){background:#ffd400}.reg i:nth-child(4){background:#111}
.titlewrap{display:flex;flex-direction:column;align-items:center;flex:1 1 180px;min-width:0;gap:0}
#pname{width:100%;max-width:340px;min-width:0;height:22px;padding:0 8px;text-align:center;font-weight:600;font-size:13px;border:0;border-radius:5px;background:transparent;box-shadow:none}
#pname:hover{background:var(--hover)}
#pname:focus{background:var(--field);box-shadow:0 0 0 .5px var(--line2)}
.saved{font-size:11px;line-height:1.1;color:var(--muted);white-space:nowrap}
.grp{display:flex;align-items:center;gap:1px;padding:2px;background:var(--seg);border-radius:7px}
.spacer{flex:1 1 auto}
.zoomv{font:11px var(--f-ui);font-variant-numeric:tabular-nums;min-width:48px;text-align:center;color:var(--muted);display:inline-flex;align-items:center;gap:1px}
.zoomv input{width:38px;font:inherit;text-align:right;border:0;background:transparent;color:inherit;padding:0;-moz-appearance:textfield;outline:none}
.zoomv input::-webkit-inner-spin-button,.zoomv input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.zoomv input:focus{color:var(--text,#000);background:rgba(0,122,255,.12);border-radius:4px}
.i{width:16px;height:16px;display:block;flex:0 0 auto}

/* controls */
.btn{height:28px;padding:0 12px;border:0;border-radius:6px;background:var(--surface2);color:var(--ink);cursor:pointer;white-space:nowrap;box-shadow:0 0 0 .5px var(--line2),0 1px 1px rgba(0,0,0,.07);transition:box-shadow .12s}
.btn:hover:not(:disabled){box-shadow:0 0 0 .5px var(--line2),0 1px 1px rgba(0,0,0,.07),inset 0 0 0 100px var(--hover)}
.btn:active:not(:disabled){box-shadow:0 0 0 .5px var(--line2),inset 0 0 0 100px var(--seg)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-weight:500;box-shadow:0 0 0 .5px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.2)}
.btn.primary:hover:not(:disabled){box-shadow:0 0 0 .5px rgba(0,0,0,.25),inset 0 0 0 100px rgba(0,0,0,.1)}
.btn.on{background:color-mix(in srgb,var(--accent) 16%,var(--surface2));color:var(--accent);box-shadow:0 0 0 .5px color-mix(in srgb,var(--accent) 55%,transparent)}
.btn.icon{display:grid;place-items:center;width:30px;height:24px;padding:0;border-radius:5px;background:transparent;box-shadow:none}
.btn.icon:hover:not(:disabled){background:var(--hover);box-shadow:none}
.btn.icon:active:not(:disabled){background:var(--seg);box-shadow:none}
.btn.sm{height:24px;padding:0 9px;font-size:12px}
.btn.danger{color:var(--danger)}
input[type=text],input[type=number],select,textarea{background:var(--field);border:0;border-radius:5px;padding:0 7px;height:24px;min-width:0;box-shadow:0 0 0 .5px var(--line2),inset 0 1px 1px rgba(0,0,0,.06)}
input[type=text]:focus,input[type=number]:focus,select:focus,textarea:focus{outline:3px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:0}
textarea{width:100%;height:auto;min-height:72px;padding:6px 8px;resize:vertical}
input[type=color]{width:34px;height:24px;padding:0;border:0;border-radius:5px;background:var(--field);box-shadow:0 0 0 .5px var(--line2);cursor:pointer}
input[type=range]{accent-color:var(--accent);min-width:0}
input[type=checkbox],input[type=radio]{accent-color:var(--accent)}

/* source list */
#list{grid-area:list;background:var(--sidebar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-right:1px solid var(--line);overflow:auto;padding:10px;display:flex;flex-direction:column;gap:12px;min-height:0}
.ltb{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:2px;background:var(--seg);border-radius:7px}
.ltb .btn{width:auto;height:24px}

    const src=(opt&&opt.src&&opt.src.get(bg.img))||rec.prev,iw=rec.w,ih=rec.h,sc=Math.max(w/iw,h/ih)*(bg.zoom||1),dw=iw*sc,dh=ih*sc;

function drawItem(ctx,it,k,opt){

function photoBase(it,rec){return Math.max(it.w/rec.w,it.h/rec.h)}
function photoZoom(it){const rec=it.img&&IMGS.get(it.img);return it.pg&&rec?it.pg.w/(rec.w*photoBase(it,rec)):it.zoom}

/* world point of a handle on the photo itself (hx,hy in -1..1 of the photo rect; ex = extra distance outward in mm along -y) */

function photoHandle(it,g,hx,hy,ex){

  return[clamp(q[0],-pd+m,view.W+pd-m),clamp(q[1],-pd+m,view.H+pd-m)];

const ROTCUR=(()=>{const svg="<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'><path d='M19 12a7 7 0 1 1-2.2-5.1' fill='none' stroke='white' stroke-width='4.5' stroke-linecap='round'/><path d='M19 12a7 7 0 1 1-2.2-5.1' fill='none' stroke='black' stroke-width='2' stroke-linecap='round'/><path d='M14 3.5l4 3.5-5 1z' fill='black' stroke='white' stroke-width='1.2'/></svg>";return 'url("data:image/svg+xml,'+encodeURIComponent(svg)+'") 12 12, crosshair'})();

function segDist(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy,t=l?clamp(((px-ax)*dx+(py-ay)*dy)/l,0,1):0;return Math.hypot(px-(ax+t*dx),py-(ay+t*dy))}

  if(Math.abs(lx)<=hw||Math.abs(ly)<=hh)return false;

function photoZone(sel,x,y){
  const g=photoGeom(sel);if(!g)return null;const k=view.k;
  {const rp=photoRotPos(sel,g);if(Math.hypot(rp[0]-x,rp[1]-y)*k<=14)return{type:'prot'}}
  for(const[hx,hy]of HND){const w=photoHandle(sel,g,hx,hy);if(Math.hypot(w[0]-x,w[1]-y)*k<=14)return{type:'zoom',hx,hy}}

function clampPhoto(it){

function drawPhoto(ctx,it,k,opt){
  const rec=it.img&&IMGS.get(it.img),w=it.w,h=it.h,r=(it.rad||0)*Math.min(w,h)/2;

    if(!opt.placeholder)return;
    ctx.beginPath();rrPath(ctx,w,h,r);ctx.fillStyle=COL.ph||'rgba(100,120,140,.2)';ctx.fill();
    if(opt.placeholder==='full'){

function drawSticker(ctx,it,k,opt){

function mkSticker(id){const rec=IMGS.get(id),H=P.ph*.28,ar=rec.w/rec.h;let w=H*ar,h=H;if(w>P.pw*.8){w=P.pw*.8;h=w/ar}return{id:uid(),type:'sticker',img:id,x:0,y:0,w,h,rot:0,op:1,shadow:false}}

/* geometry */

/* ======================= stage ======================= */
const stage=$('#stage'),scrollEl=$('#scroll');
let rafId=0;
function readColors(){

function layoutStage(){
  const s=cur(),W=spreadW(s),H=P.ph,pad=P.bleed+8;

  stage.style.width=cssW+'px';stage.style.height=cssH+'px';

  {
    const gs=getSel();

        ctx.beginPath();ctx.rect(0,0,W,H);
        [[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b])=>toWorld(gs,a*gs.w/2,b*gs.h/2)).forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));ctx.closePath();

      }
    }
  }

  {const zv=$('#zoomv');if(zv&&document.activeElement!==zv)zv.value=Math.round(state.zoom*100)}

    for(const[a,c]of panels)ctx.strokeRect(X(a+sf),X(sf),(c-a-2*sf)*kb,(H-2*sf)*kb);
  }
  ctx.restore();
}
function cropRisk(it,s){
  const W=spreadW(s),H=P.ph,b=P.bleed,sf=it.type==='text'?P.safe:null,e=1e-6;
  const c=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,d])=>toWorld(it,a*it.w/2,d*it.h/2));
  const mid=s.kind==='spread'?P.pw:null;
  /* which boundaries a point violates: bit per side, hard = outside the printable area, soft = inside the safe margin (text only) */
  const viol=([x,y])=>{const m=[];
    if(x<-b-e)m.push('Lh');else if(sf!=null&&x<sf&&!(mid!=null&&x>mid-sf&&x<mid+sf))m.push('Ls');
    if(x>W+b+e)m.push('Rh');else if(sf!=null&&x>W-sf)m.push('Rs');
    if(y<-b-e)m.push('Th');else if(sf!=null&&y<sf)m.push('Ts');
    if(y>H+b+e)m.push('Bh');else if(sf!=null&&y>H-sf)m.push('Bs');
    return m};
  const V=c.map(viol),out=[];
  for(let i=0;i<4;i++){
    const A=V[i],B=V[(i+1)%4],common=A.filter(k=>B.includes(k));
    if(common.length)out.push({a:c[i],b:c[(i+1)%4],hard:common.some(k=>k[1]==='h')});
  }
  if(!out.length){/* rotated item: only a corner pokes out, mark the two edges meeting there */
    for(let i=0;i<4;i++)if(V[i].length){const hard=V[i].some(k=>k[1]==='h');for(const[p,q]of[[(i+3)%4,i],[i,(i+1)%4]])out.push({a:c[p],b:c[q],hard})}
  }
  return out;
}
function drawOverlay(ctx,s,kb,pad){
  const u=view.u,X=v=>(v+pad)*kb;
  ctx.save();
  if(state.dropHover){
    const it=s.items.find(i=>i.id===state.dropHover);
    if(it){const c=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b])=>toWorld(it,a*it.w/2,b*it.h/2));ctx.strokeStyle=COL.accent;ctx.lineWidth=4*u;ctx.beginPath();c.forEach((p,i)=>i?ctx.lineTo(X(p[0]),X(p[1])):ctx.moveTo(X(p[0]),X(p[1])));ctx.closePath();ctx.stroke()}
  }
  {
    let warn=null;
    for(const o of s.items){
      const r=cropRisk(o,s);if(!r.length)continue;
      ctx.save();ctx.strokeStyle='#ff3b30';ctx.lineWidth=4*u;ctx.lineCap='round';ctx.setLineDash([]);
      for(const e of r){ctx.beginPath();ctx.moveTo(X(e.a[0]),X(e.a[1]));ctx.lineTo(X(e.b[0]),X(e.b[1]));ctx.stroke()}
      ctx.restore();
      if(o.id===state.sel)warn={o,hard:r.some(e=>e.hard)};
    }
    state.cropWarn=warn?(warn.hard?'Частина виходить за межі сторінки — буде обрізано':'Текст у небезпечній зоні біля краю — може бути обрізано'):'';
    if(warn){
      const o=warn.o,c0=itemCenter(o),txt='⚠ '+(warn.hard?'Буде обрізано':'Може бути обрізано');
      ctx.save();ctx.font=`600 ${12*u}px -apple-system, BlinkMacSystemFont, system-ui, sans-serif`;
      const tw=ctx.measureText(txt).width+16*u,th=22*u,m=8*u;
      let x=X(c0[0])-tw/2,y=X(c0[1])-th/2;x=Math.max(m,Math.min(ctx.canvas.width-tw-m,x));y=Math.max(m,Math.min(ctx.canvas.height-th-m,y));
      ctx.fillStyle='#ff3b30';ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,tw,th,6*u):ctx.rect(x,y,tw,th);ctx.fill();
      ctx.fillStyle='#fff';ctx.textBaseline='middle';ctx.fillText(txt,x+8*u,y+th/2+.5*u);ctx.restore();
    }
  }
  const it=getSel();
  if(it){
    const c=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b])=>toWorld(it,a*it.w/2,b*it.h/2));
    ctx.strokeStyle=COL.accent;ctx.lineWidth=1.5*u;ctx.setLineDash(state.crop?[6*u,4*u]:[]);
    ctx.beginPath();c.forEach((p,i)=>i?ctx.lineTo(X(p[0]),X(p[1])):ctx.moveTo(X(p[0]),X(p[1])));ctx.closePath();ctx.stroke();ctx.setLineDash([]);
    if(state.crop&&it.type==='photo'&&it.img&&photoGeom(it)){
      const g=photoGeom(it),sz=11*u;ctx.setLineDash([]);ctx.lineWidth=1.5*u;
      const cs=[[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b])=>photoPt(it,g,a,b));
      ctx.lineWidth=2*u;ctx.beginPath();cs.forEach((q,i)=>i?ctx.lineTo(X(q[0]),X(q[1])):ctx.moveTo(X(q[0]),X(q[1])));ctx.closePath();ctx.stroke();ctx.lineWidth=1.5*u;
      for(const[hx,hy]of HND){const q=photoHandle(it,g,hx,hy);ctx.beginPath();ctx.arc(X(q[0]),X(q[1]),sz/2,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.stroke()}
      {const t0=photoPt(it,g,0,-1),rp=photoRotPos(it,g);ctx.beginPath();ctx.moveTo(X(t0[0]),X(t0[1]));ctx.lineTo(X(rp[0]),X(rp[1]));ctx.stroke();
       ctx.beginPath();ctx.arc(X(rp[0]),X(rp[1]),7*u,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.stroke()}
    }
    if(!state.crop){
      const sz=11*u;
      for(const[hx,hy]of handlesOf(it)){const p=toWorld(it,hx*it.w/2,hy*it.h/2);ctx.beginPath();ctx.arc(X(p[0]),X(p[1]),sz/2,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.lineWidth=1.5*u;ctx.stroke()}
      const top=toWorld(it,0,-it.h/2),rp=toWorld(it,0,-it.h/2-26/view.k);
      ctx.beginPath();ctx.moveTo(X(top[0]),X(top[1]));ctx.lineTo(X(rp[0]),X(rp[1]));ctx.stroke();
      ctx.beginPath();ctx.arc(X(rp[0]),X(rp[1]),6*u,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();ctx.stroke();
    }
  }
  if(it&&it.type==='photo'&&!it.img&&!state.crop){
    const c=itemCenter(it),cx=X(c[0]),cy=X(c[1]),r=14*u;
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=COL.accent;ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=2*u;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(cx-6*u,cy);ctx.lineTo(cx+6*u,cy);ctx.moveTo(cx,cy-6*u);ctx.lineTo(cx,cy+6*u);ctx.stroke();
  }
  ctx.strokeStyle=COL.bleed;ctx.lineWidth=1*u;
  if(state.snap.x!=null){ctx.beginPath();ctx.moveTo(X(state.snap.x),0);ctx.lineTo(X(state.snap.x),stage.height);ctx.stroke()}
  if(state.snap.y!=null){ctx.beginPath();ctx.moveTo(0,X(state.snap.y));ctx.lineTo(stage.width,X(state.snap.y));ctx.stroke()}
  ctx.restore();
}

let idb=null,saveTimer=0;

const idbReq=(store,mode,fn)=>new Promise((res,rej)=>{if(!idb)return rej(new Error('no idb'));try{const tx=idb.transaction(store,mode),r=fn(tx.objectStore(store));tx.oncomplete=()=>res(r&&r.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)}catch(e){rej(e)}});

async function bitmapOf(blob,opts){try{return await createImageBitmap(blob,{imageOrientation:'from-image',...(opts||{})})}catch(e){return await createImageBitmap(blob)}}
async function makePreview(blob,alpha){
  const bmp=await bitmapOf(blob),w=bmp.width,h=bmp.height,sc=Math.min(1,1800/Math.max(w,h));
  let prev=bmp;
  if(sc<1){const c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(bmp,0,0,c.width,c.height);bmp.close();prev=c}
  const t=document.createElement('canvas'),ts=Math.min(1,240/Math.max(w,h));t.width=Math.max(1,Math.round(w*ts));t.height=Math.max(1,Math.round(h*ts));
  const tx=t.getContext('2d');tx.imageSmoothingQuality='high';tx.drawImage(prev,0,0,t.width,t.height);
  return{prev,w,h,thumb:alpha?t.toDataURL('image/png'):t.toDataURL('image/jpeg',.72)};
}
async function registerImage(blob,name,id,flags){
  const pv=await makePreview(blob,flags&&flags.st);
  id=id||uid();const rec={id,name,blob,w:pv.w,h:pv.h,prev:pv.prev,thumb:pv.thumb};
  IMGS.set(id,rec);
  if(!P.images.find(m=>m.id===id))P.images.push(Object.assign({id,name,w:pv.w,h:pv.h},flags&&(flags.bg||flags.st)?{bg:true}:{},flags&&flags.st?{st:true}:{}));
  if(hasIDB)idbPut('img',id,{blob,name}).catch(()=>{});
  return rec;
}
async function importFiles(files){
  const list=[...files].filter(f=>/^image\//.test(f.type)||/\.(jpe?g|png|webp|gif|avif|bmp|psd|tiff?|heic|heif|svg|ico)$/i.test(f.name));
  if(!list.length){toast('Не знайдено зображень. Підтримуються JPG, PNG, WebP, GIF, AVIF, BMP, SVG, TIFF, HEIC, PSD.');return[]}
  const ids=[];let i=0;
  for(const f of list){
    i++;toast(`Завантаження ${i} з ${list.length}…`,true);
    try{if(/\.psd$/i.test(f.name)){const got=await importPSD(f);ids.push(...got)}else{const r=await registerImage(f,f.name);ids.push(r.id)}}catch(e){console.warn(e);toast(/PSD|PSB|Режим|біт|Максим/.test(e.message)?e.message:`Не вдалося прочитати «${f.name}»`)}
    if(state.tab==='photos'&&i%4===0)renderPanel();
  }
  if(ids.length)toast(`Додано фото: ${ids.length}`);
  commit();renderPanel();return ids;
}
function usedSet(){const u=new Set();for(const s of P.spreads)for(const it of s.items)if(it.type==='photo'&&it.img)u.add(it.img);return u}
function setPhoto(it,id){it.img=id;it.cx=.5;it.cy=.5;it.zoom=1;it.pr=0;delete it.pg}
function placeImage(id){
  const s=cur(),sel=getSel();
  if(sel&&sel.type==='photo'){setPhoto(sel,id)}
  else{
    const slot=s.items.find(i=>i.type==='photo'&&!i.img);
    if(slot){setPhoto(slot,id);state.sel=slot.id}
    else{
      const rec=IMGS.get(id),W=spreadW(s),H=P.ph,h=H*.5,w=Math.min(W*.45,h*(rec.w/rec.h));
      const it=mkPhoto([W/2-w/2,H/2-h/2,w,w/(rec.w/rec.h)>H*.9?H*.9:w/(rec.w/rec.h)],id);s.items.push(it);state.sel=it.id;
    }

}
function autoLayout(){
  const used=usedSet(),queue=P.images.filter(m=>!m.bg).map(m=>m.id).filter(id=>!used.has(id)&&IMGS.has(id));
  if(!queue.length){toast('Усі фото вже на розворотах');return}
  const total=queue.length;
  for(let i=1;i<P.spreads.length&&queue.length;i++)for(const it of P.spreads[i].items)if(it.type==='photo'&&!it.img&&queue.length)setPhoto(it,queue.shift());
  let pi=0,vary=0;
  while(queue.length){
    let n=Math.min(AUTO_PATTERN[pi++%AUTO_PATTERN.length],queue.length);
    const opts=LAYOUTS.filter(l=>l.n===n&&l.auto!==false);const L=opts[vary++%opts.length]||LAYOUTS[0];
    const s=mkSpread();fillLayout(s,layoutRects(L,s),L.id);
    s.items.filter(i=>i.type==='photo').forEach(it=>{if(queue.length)setPhoto(it,queue.shift())});
    P.spreads.push(s);
  }
  commit();renderList();markList();renderPanel();redraw();toast(`Розкладено фото: ${total}`);
}

function selectItem(id,o={}){
  state.sel=id;state.crop=false;
  if(id&&o.auto&&state.pickPhoto){const si=getSel();if(si&&si.type==='photo'&&si.img)state.crop=true}
  else if(!id&&state.tab==='obj')state.tab=state.prevTab||'photos';
  renderPanel();redraw();updateStatus();
}
function centerOfPage(s){const W=spreadW(s);return s.kind==='cover'?[W-P.pw/2,P.ph/2]:[W/2,P.ph/2]}
function addItem(it){
  const s=cur(),[cx,cy]=centerOfPage(s);it.x=cx-it.w/2;it.y=cy-it.h/2;s.items.push(it);
  commit();selectItem(it.id,{auto:true});
  if(it.type==='text')ensureFont(it);
}
function dupItem(){const it=getSel();if(!it)return;const c=JSON.parse(JSON.stringify(it));c.id=uid();c.x+=5;c.y+=5;cur().items.push(c);commit();selectItem(c.id,{auto:true})}
function delItem(){const it=getSel();if(!it)return;const s=cur();s.items=s.items.filter(i=>i!==it);commit();selectItem(null)}
function itemBox(it){
  const c=itemCenter(it),r=(it.rot||0)*Math.PI/180,a=Math.abs(Math.cos(r)),b=Math.abs(Math.sin(r)),w=it.w*a+it.h*b,h=it.w*b+it.h*a;
  return[c[0]-w/2,c[1]-h/2,c[0]+w/2,c[1]+h/2];
}
function zOrder(d){
  const s=cur(),it=getSel();if(!it)return;const L=s.items,i=L.indexOf(it);
  const A=itemBox(it);let j=i;
  for(let n=i+d;n>=0&&n<L.length;n+=d){const B=itemBox(L[n]);if(A[0]<B[2]&&A[2]>B[0]&&A[1]<B[3]&&A[3]>B[1]){j=n;break}}
  if(j===i)j=d>0?L.length-1:0;
  if(i===j){toast(d>0?'Вже на передньому плані':'Вже на задньому плані');return}
  L.splice(i,1);L.splice(j,0,it);commit();redraw();toast(d>0?'Перенесено вперед':'Перенесено назад');
}
function addSpread(){
  const s=mkSpread(),L=LAYOUTS.find(l=>l.id==='two');fillLayout(s,layoutRects(L,s),L.id);
  const at=Math.max(1,state.cur+1);P.spreads.splice(at,0,s);commit();renderList();gotoSpread(at);
}
function dupSpread(){
  if(state.cur===0){toast('Обкладинку дублювати не можна');return}
  const c=JSON.parse(JSON.stringify(cur()));c.id=uid();c.items.forEach(i=>i.id=uid());
  P.spreads.splice(state.cur+1,0,c);commit();renderList();gotoSpread(state.cur+1);
}
function delSpread(){
  if(state.cur===0){toast('Обкладинку видалити не можна');return}
  if(P.spreads.length<=2){toast('Потрібен принаймні один розворот');return}
  P.spreads.splice(state.cur,1);commit();renderList();gotoSpread(Math.min(state.cur,P.spreads.length-1));
}
function moveSpread(d){
  const i=state.cur,j=i+d;if(i===0||j<1||j>=P.spreads.length)return;
  const[s]=P.spreads.splice(i,1);P.spreads.splice(j,0,s);commit();renderList();gotoSpread(j);
}
function applyLayoutById(id){
  const s=cur();let rects;
  if(s.kind==='cover'){const L=coverLayouts().find(l=>l.id===id);if(!L)return;rects=L.rects}
  else{const L=LAYOUTS.find(l=>l.id===id);if(!L)return;rects=layoutRects(L,s)}
  fillLayout(s,rects,id);state.sel=null;state.crop=false;redraw();

function bgTargets(){
  const c=cur();
  if(state.bgScope==='all'){const t=P.spreads.filter(x=>x.kind==='spread');if(c.kind==='cover')t.push(c);return t}
  if(state.bgScope==='pick'){const t=P.spreads.filter(x=>state.bgPick.includes(x.id));if(!t.includes(c))t.push(c);return t}

function snapCands(s,exId,exSet){

const edgeVal=(o,e)=>e==='l'?o.x:e==='r'?o.x+o.w:e==='t'?o.y:o.y+o.h;

  const s=cur(),out=[],edges=[];

  for(const o of s.items){
    if(o===it||o.type!=='photo'||o.rot)continue;
    for(const e of edges){
      const mine=edgeVal(it,e),horiz=e==='l'||e==='r';
      const a0=horiz?it.y:it.x,a1=horiz?it.y+it.h:it.x+it.w,b0=horiz?o.y:o.x,b1=horiz?o.y+o.h:o.x+o.w;
      if(Math.min(a1,b1)-Math.max(a0,b0)<1)continue;
      const opp={l:'r',r:'l',t:'b',b:'t'}[e],dSame=edgeVal(o,e)-mine,dOpp=edgeVal(o,opp)-mine,pos=e==='r'||e==='b';
      const facing=pos?(dOpp>=-.6&&dOpp<=15):(dOpp<=.6&&dOpp>=-15);
      if(Math.abs(dSame)<.6)out.push({o,e,mine:e,v:edgeVal(o,e),startMine:mine,s:{x:o.x,y:o.y,w:o.w,h:o.h}});
      else if(facing)out.push({o,e:opp,mine:e,v:edgeVal(o,opp),startMine:mine,s:{x:o.x,y:o.y,w:o.w,h:o.h}});

function applyLinks(it,on){

  for(const L of drag.links){
    const o=L.o,s0=L.s;o.x=s0.x;o.y=s0.y;o.w=s0.w;o.h=s0.h;
    if(!on)continue;
    const d=edgeVal(it,L.mine)-L.startMine,nv=L.v+d;
    if(L.e==='l'){const x2=s0.x+s0.w;o.x=Math.min(nv,x2-4);o.w=x2-o.x}

  }
}

const touches=new Map();let pinch=null,pinchLock=false;

    if(drag){if(drag.mode==='move'&&drag.start)Object.assign(drag.it,drag.start);drag=null}
    const m=tMid();pinch={d0:m.d,z0:state.zoom,x:m.x,y:m.y};pinchLock=true;

  if(e.pointerType!=='touch'||!touches.has(e.pointerId))return;
  touches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&touches.size>=2){
    const m=tMid(),old=view.cssW,z=clamp(Math.round(pinch.z0*m.d/pinch.d0*100)/100,.5,4);
    const r=scrollEl.getBoundingClientRect(),cx=pinch.x-r.left,cy=pinch.y-r.top;

document.addEventListener('keydown',e=>{
  if(!$('#modal').hidden){if(e.key==='Escape')closeModal();return}
  const tag=(e.target.tagName||'').toLowerCase(),typing=tag==='input'||tag==='textarea'||tag==='select';
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&e.key.toLowerCase()==='y'&&!typing){e.preventDefault();redo();return}
  if(typing)return;
  if(mod&&e.key.toLowerCase()==='d'){e.preventDefault();dupItem();return}
  if(e.key==='Escape'){if(state.crop){state.crop=false;renderPanel();redraw();updateStatus()}else if(state.sel)selectItem(null);return}
  const it=getSel();if(!it)return;
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();delItem();return}
  const d=e.shiftKey?5:.5;let moved=true;
  if(e.key==='ArrowLeft')it.x-=d;else if(e.key==='ArrowRight')it.x+=d;else if(e.key==='ArrowUp')it.y-=d;else if(e.key==='ArrowDown')it.y+=d;else moved=false;
  if(moved){e.preventDefault();updateNums(it);redraw();clearTimeout(txtTimer);txtTimer=setTimeout(commit,500)}
});

let expOpt={fmt:'pdf',mode:'spread',dpi:300,bleed:true},expResult=null;
function exportPages(opt){

      out.push({s,i,part:'R',reg:{x0:P.pw,y0:-b,x1:W+b,y1:H+b,tx0:P.pw,ty0:0,tx1:W,ty1:H}});

  const wpx=Math.round((first.reg.x1-first.reg.x0)*k),hpx=Math.round((first.reg.y1-first.reg.y0)*k);

  return `${pg.length} ${pg.length===1?'сторінка':'стор. у файлі'} · найбільша ${Math.round(Math.max(...pg.map(p=>(p.reg.x1-p.reg.x0)))*k)} × ${Math.round(Math.max(...pg.map(p=>(p.reg.y1-p.reg.y0)))*k)} px`+(big>16.7e6?'<br><span style="color:var(--danger)">Дуже великий розмір: на телефоні може не вистачити пам’яті. Спробуйте 200 dpi.</span>':'');

async function loadFull(s){

}
async function renderRegion(s,reg,dpi,fmt){

const _i16=v=>{const a=new Uint8Array(2);new DataView(a.buffer).setInt16(0,v);return a};
const _i32=v=>{const a=new Uint8Array(4);new DataView(a.buffer).setInt32(0,v);return a};
const _u32=v=>{const a=new Uint8Array(4);new DataView(a.buffer).setUint32(0,v);return a};

async function renderPsd(s,reg,dpi){
  const k=dpi/MM,wpx=Math.round((reg.x1-reg.x0)*k),hpx=Math.round((reg.y1-reg.y0)*k);
  const src=await loadFull(s),opt={src,placeholder:false},layers=[];
  const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
  {const c=mk(wpx,hpx),x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,wpx,hpx);
   paintSpread(x,{...s,items:[]},k,-reg.x0*k,-reg.y0*k,opt);
   layers.push({name:'Фон',top:0,left:0,w:wpx,h:hpx,rgba:x.getImageData(0,0,wpx,hpx).data});c.width=c.height=1}
  const names={photo:'Фото',text:'Текст',shape:'Фігура',sticker:'Стікер'},cnt={};
  for(const it of s.items){
    const B=itemBox(it),m=4;
    const l=Math.max(0,Math.floor((B[0]-m-reg.x0)*k)),t=Math.max(0,Math.floor((B[1]-m-reg.y0)*k)),r=Math.min(wpx,Math.ceil((B[2]+m-reg.x0)*k)),b=Math.min(hpx,Math.ceil((B[3]+m-reg.y0)*k));

    const nm=it.type==='text'&&it.t?String(it.t).replace(/\s+/g,' ').slice(0,24):`${names[it.type]||'Шар'} ${cnt[it.type]}`;
    layers.push({name:nm,top:t,left:l,w:r-l,h:b-t,rgba:x.getImageData(0,0,r-l,b-t).data});c.width=c.height=1;

async function runExport(){

    const fonts=[];for(const s of P.spreads)for(const it of s.items)if(it.type==='text')fonts.push(ensureFont(it));
    await Promise.all(fonts);

      const p=pages[n];txt.textContent=`Сторінка ${n+1} з ${pages.length}…`;bar.firstElementChild.style.width=(n/pages.length*90)+'%';
      await new Promise(r=>setTimeout(r,20));
      const r=opt.fmt==='psd'?await renderPsd(p.s,p.reg,opt.dpi):await renderRegion(p.s,p.reg,opt.dpi,opt.fmt);
      done.push({...p,...r});
    }

    let blob,filename;const base=slug(P.name);
    if(opt.fmt==='psd'){
      if(done.length===1){blob=new Blob([done[0].psd],{type:'image/vnd.adobe.photoshop'});filename=base+'.psd'}
      else{const files=[];for(const d of done){const i=d.i;let nm;if(i===0)nm='00-cover';else if(!d.part)nm=`${String(i).padStart(2,'0')}-spread-${2*i-1}-${2*i}`;else nm=`page-${String(d.part==='L'?2*i-1:2*i).padStart(3,'0')}`;files.push({name:nm+'.psd',data:d.psd})}blob=await makeZip(files);filename=base+'-psd.zip'}
    }else if(opt.fmt==='pdf'){
      blob=buildPDF(done.map(d=>({blob:d.blob,wpx:d.wpx,hpx:d.hpx,wmm:d.reg.x1-d.reg.x0,hmm:d.reg.y1-d.reg.y0,trim:opt.bleed?[d.reg.tx0-d.reg.x0,d.reg.ty0-d.reg.y0,d.reg.tx1-d.reg.x0,d.reg.ty1-d.reg.y0]:null})),P.name);
      filename=base+'.pdf';
    }else{
      const files=[];
      for(let n=0;n<done.length;n++){
        const d=done[n],i=d.i;let nm;
        if(i===0)nm='00-cover';else if(!d.part)nm=`${String(i).padStart(2,'0')}-spread-${2*i-1}-${2*i}`;else nm=`page-${String(d.part==='L'?2*i-1:2*i).padStart(3,'0')}`;
        const ext=opt.fmt==='tiff'?'tif':opt.fmt;
        files.push({name:nm+'.'+ext,data:opt.fmt==='tiff'?d.data:opt.fmt==='png'?await setPngDpi(d.blob,opt.dpi):opt.fmt==='webp'?d.blob:await setJpegDpi(d.blob,opt.dpi)});
      }
      blob=await makeZip(files);filename=base+'-'+opt.fmt+'.zip';
    }
    expResult={blob,filename};bar.firstElementChild.style.width='100%';
    const mb=(blob.size/1048576).toFixed(1);
    txt.innerHTML=`Готово: ${esc(filename)} · ${mb} МБ`;
    run.disabled=false;run.textContent='Зберегти файл';run.dataset.act='saveExport';
  }catch(e){
    console.error(e);txt.textContent='Не вдалося створити файл. Спробуйте нижчу роздільність.';run.disabled=false;bar.hidden=true;
  }
}
let dlP=null;
function getDL(){
  if(dl)return Promise.resolve(dl);
  if(dlP)return dlP;
  dlP=(async()=>{
    /* the viewer runtime can attach after the page script starts, so wait for it instead of checking once */
    for(let i=0;i<30;i++){
      if(window.claude&&typeof window.claude.use==='function'){
        try{const d=await window.claude.use('downloads');if(d){dl=d;return d}}catch(e){}
        return null;
      }
      await new Promise(r=>setTimeout(r,250));
    }
    return null;
  })().finally(()=>{dlP=null});
  return dlP;
}
async function saveBlob(filename,blob,okMsg){
  const d=await getDL();
  if(d){
    try{await d.save({filename,data:blob});if(okMsg)toast(okMsg);return true}
    catch(e){if(e&&e.code==='declined')return false;toast('Не вдалося зберегти файл'+(e&&e.code?' ('+e.code+')':''));return false}
  }
  try{
    const url=URL.createObjectURL(blob),a=document.createElement('a');
    a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),120000);
    toast((window.claude?'Збереження через Claude недоступне. ':'Середовище Claude не відповіло. ')+'Спроба завантажити через браузер. Якщо файл не з’явився, відкрийте сторінку в окремій вкладці.');
    return true;
  }catch(e){toast('Не вдалося зберегти файл');return false}
}

async function svgToPng(file){
  let txt=await file.text();
  const doc=new DOMParser().parseFromString(txt,'image/svg+xml'),el=doc.documentElement;
  if(!el||el.nodeName.toLowerCase()!=='svg'||doc.querySelector('parsererror'))throw new Error('svg');
  let w=parseFloat(el.getAttribute('width')),h=parseFloat(el.getAttribute('height'));const vb=(el.getAttribute('viewBox')||'').trim().split(/[\s,]+/).map(Number);
  if(!(w>0&&h>0)){if(vb.length===4&&vb[2]>0&&vb[3]>0){w=vb[2];h=vb[3]}else{w=512;h=512}}
  if(!el.getAttribute('viewBox'))el.setAttribute('viewBox',`0 0 ${w} ${h}`);
  const sc=2048/Math.max(w,h),cw=Math.max(1,Math.round(w*sc)),ch=Math.max(1,Math.round(h*sc));
  el.setAttribute('width',cw);el.setAttribute('height',ch);
  const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(el)],{type:'image/svg+xml'}));
  try{
    const img=new Image();img.src=url;await img.decode();
    const c=document.createElement('canvas');c.width=cw;c.height=ch;c.getContext('2d').drawImage(img,0,0,cw,ch);
    const blob=await new Promise(r=>c.toBlob(r,'image/png'));c.width=c.height=1;
    if(!blob)throw new Error('png');return blob;
  }finally{URL.revokeObjectURL(url)}
}
